schema_version: "1.0"
name: 10-ui-nut-play
description: Câu UI. Skill game-animation không được bật; UI đi UI Motion (đầu quy chuẩn, 8.3 mục 11).
tags: [negative, ui]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Thêm hiệu ứng nảy khi bấm nút Play ở màn hình chính giúp mình.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: khong_bat_nham
    tool: Skill
    input_match: game-animation
    max: 0
    arm: with-only
  - type: llm
    name: huong_ui
    criteria: >-
      Câu trả lời xử lý nút Play bằng hệ UI Motion của project (ví dụ component UIMotionButton, role Button, Profile hoặc
      RoleMap) hoặc bằng tween, không đề xuất làm AnimationClip hay Animator Controller cho nút.
