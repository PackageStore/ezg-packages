<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI Kit</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101216;
  --panel: #191c22;
  --line: #343a44;
  --text: #f2f4f6;
  --muted: #9ba4ae;
  --cyan: #57d6e7;
  --gold: #efb957;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: Inter, -apple-system, "Segoe UI", sans-serif;
}
.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  padding: 18px 32px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(16, 18, 22, .94);
  backdrop-filter: blur(14px);
}
.heading, .toolbar, .grid { max-width: 1600px; margin-inline: auto; }
.heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
h1 { margin: 0; font-size: 30px; letter-spacing: 0; }
.summary { color: var(--muted); font: 12px/1.5 ui-monospace, monospace; }
.summary b { color: var(--cyan); }
.toolbar { display: flex; gap: 10px; margin-top: 14px; }
.search {
  min-width: 180px;
  height: 42px;
  flex: 1;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 6px;
  outline: 0;
  color: var(--text);
  background: #0d0f13;
  font: 14px inherit;
}
.search:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(87, 214, 231, .1); }
.segmented { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 6px; background: #0d0f13; }
.segmented button {
  min-width: 82px;
  border: 0;
  border-radius: 4px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}
.segmented button.active { color: #081114; background: var(--cyan); font-weight: 800; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
  gap: 16px;
  padding: 24px 32px 60px;
}
.card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.card[hidden] { display: none; }
.preview {
  position: relative;
  display: block;
  width: 100%;
  height: 280px;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  color: inherit;
  background: #0b0d12;
  cursor: zoom-in;
}
.preview:focus-visible { outline: 2px solid var(--cyan); outline-offset: -3px; }
.checker {
  position: absolute;
  inset: 0;
  opacity: .5;
  background-image:
    linear-gradient(45deg, #151920 25%, transparent 25%),
    linear-gradient(-45deg, #151920 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #151920 75%),
    linear-gradient(-45deg, transparent 75%, #151920 75%);
  background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  background-size: 24px 24px;
}
.prefab-host { position: absolute; inset: 16px; overflow: hidden; }
.prefab-canvas { position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center; }
.unity-node { position: absolute; overflow: visible; }
.unity-image, .unity-text { position: absolute; inset: 0; }
.unity-image { overflow: hidden; pointer-events: none; }
.unity-image .patch { position: absolute; overflow: hidden; }
.unity-image .patch img { position: absolute; max-width: none; pointer-events: none; }
.unity-text {
  display: flex;
  padding: 0;
  overflow: hidden;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  line-height: 1;
}
.inspect {
  position: absolute;
  right: 10px;
  bottom: 10px;
  padding: 6px 8px;
  border: 1px solid rgba(87, 214, 231, .4);
  border-radius: 4px;
  color: var(--cyan);
  background: rgba(8, 12, 17, .82);
  font: 700 9px/1 ui-monospace, monospace;
  opacity: 0;
  transform: translateY(3px);
  transition: opacity .15s, transform .15s;
}
.preview:hover .inspect { opacity: 1; transform: translateY(0); }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 15px 15px; }
.meta div { min-width: 0; }
.meta b, .meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta b { font-size: 15px; }
.meta span { margin-top: 7px; color: var(--muted); font: 10px/1.3 ui-monospace, monospace; }
.meta code { flex: none; color: var(--gold); font: 9px/1 ui-monospace, monospace; }
.empty { display: none; margin: 80px auto; color: var(--muted); text-align: center; }
.modal { position: fixed; z-index: 50; inset: 0; display: none; padding: 28px; background: rgba(3, 5, 8, .92); }
.modal.open { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.modalbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 12px; }
.modalbar b { font-size: 16px; }
.modalbar span { margin-left: 10px; color: var(--muted); font: 11px ui-monospace, monospace; }
.close {
  width: 42px;
  height: 42px;
  border: 1px solid #4b535e;
  border-radius: 6px;
  color: white;
  background: #191d24;
  font-size: 26px;
  cursor: pointer;
}
.modalhost { position: relative; min-height: 0; overflow: hidden; border: 1px solid var(--line); background: #090b0f; }
.modalhost .prefab-canvas { overflow: visible; }
.asset-warning {
  position: absolute;
  z-index: 4;
  inset: 6px;
  display: grid;
  place-items: center;
  border: 1px dashed rgba(239, 185, 87, .55);
  color: var(--gold);
  background: rgba(60, 44, 18, .2);
  font: 9px/1.3 ui-monospace, monospace;
}
#svgFilters { position: fixed; width: 0; height: 0; pointer-events: none; }
@media (max-width: 680px) {
  .topbar { padding: 16px 14px 12px; }
  .heading { display: block; }
  h1 { font-size: 24px; }
  .summary { margin-top: 7px; }
  .toolbar { min-width: 0; flex-wrap: wrap; }
  .segmented { width: 100%; min-width: 0; overflow: hidden; }
  .segmented button { width: 0; min-width: 0; flex: 1; }
  .grid { grid-template-columns: minmax(0, 1fr); padding: 16px 14px 48px; }
  .meta code { display: none; }
  .preview { height: 240px; }
  .modal { padding: 14px; }
}
</style>
</head>
<body>
<svg id="svgFilters" aria-hidden="true"><defs></defs></svg>
<header class="topbar">
  <div class="heading">
    <h1>UI Kit</h1>
    <div class="summary"><b id="visibleCount">__COUNT__</b> shown · prefab YAML + linked assets · 9-slice enabled</div>
  </div>
  <div class="toolbar">
    <input id="search" class="search" type="search" placeholder="Search prefab..." aria-label="Search prefab">
    <div class="segmented" aria-label="Preview background">
      <button class="active" type="button" data-background="checker">Checker</button>
      <button type="button" data-background="dark">Dark</button>
      <button type="button" data-background="light">Light</button>
    </div>
  </div>
</header>
<main id="grid" class="grid">__CARDS__</main>
<p id="empty" class="empty">No matching prefab.</p>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
  <div class="modalbar"><div><b id="modalName"></b><span id="modalSize"></span></div><button class="close" type="button" aria-label="Close">&times;</button></div>
  <div id="modalHost" class="modalhost"></div>
</div>
<script>
const KIT = __KIT__;
const DESIGN = [1080, 1920];
const cards = [...document.querySelectorAll('.card')];
const search = document.getElementById('search');
const visibleCount = document.getElementById('visibleCount');
const empty = document.getElementById('empty');
const filterDefs = document.querySelector('#svgFilters defs');
const tintFilters = new Map();
const fontFamilies = new Map();

function rgba(values) {
  if (!values) return 'transparent';
  return `rgba(${Math.round(values[0] * 255)},${Math.round(values[1] * 255)},${Math.round(values[2] * 255)},${values[3]})`;
}

function tintFilter(values) {
  if (!values) return '';
  const key = values.join('-');
  if (key === '1-1-1-1' || key === '1-1-1-1.0') return '';
  if (tintFilters.has(key)) return tintFilters.get(key);
  const id = `tint-${tintFilters.size}`;
  const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
  filter.id = id;
  filter.setAttribute('color-interpolation-filters', 'sRGB');
  const matrix = document.createElementNS('http://www.w3.org/2000/svg', 'feColorMatrix');
  matrix.setAttribute('type', 'matrix');
  matrix.setAttribute('values', `${values[0]} 0 0 0 0  0 ${values[1]} 0 0 0  0 0 ${values[2]} 0 0  0 0 0 ${values[3]} 0`);
  filter.appendChild(matrix);
  filterDefs.appendChild(filter);
  const url = `url(#${id})`;
  tintFilters.set(key, url);
  return url;
}

function ensureFont(path) {
  if (!path) return 'Arial, sans-serif';
  if (fontFamilies.has(path)) return fontFamilies.get(path);
  const family = `PrefabFont${fontFamilies.size}`;
  fontFamilies.set(path, family);
  const face = new FontFace(family, `url("${encodeURI(path)}")`);
  face.load().then(font => { document.fonts.add(font); fitAllText(); }).catch(() => {});
  return `"${family}", Arial, sans-serif`;
}

function preferredNodeSize(node) {
  if (!node) return [0, 0];
  const element = node.layoutElement || {};
  let width = element.preferredWidth >= 0 ? element.preferredWidth : 0;
  let height = element.preferredHeight >= 0 ? element.preferredHeight : 0;
  if (node.image && node.image.sprite) {
    const unitScale = (node.image.sprite.pixelsPerUnit || 100) / 100 * (node.image.ppuMultiplier || 1);
    width = width || node.image.sprite.rect[2] / unitScale;
    height = height || node.image.sprite.rect[3] / unitScale;
  }
  if (node.text) {
    const fontSize = node.text.bestFit ? node.text.maxSize : node.text.fontSize;
    width = width || Math.max(fontSize, (node.text.value || '').length * fontSize * .58);
    height = height || fontSize * 1.2;
  }
  if (node.layout) {
    const children = node.children.filter(child => child.active && !child.layoutElement?.ignore);
    const sizes = children.map(preferredNodeSize);
    const [left, right, top, bottom] = node.layout.padding;
    width = width || left + right + sizes.reduce((sum, size) => sum + size[0], 0)
      + Math.max(0, children.length - 1) * node.layout.spacing;
    height = height || top + bottom + Math.max(0, ...sizes.map(size => size[1]));
  }
  width = width || Math.max(0, node.rect?.size?.[0] || 0);
  height = height || Math.max(0, node.rect?.size?.[1] || 0);
  return [Math.max(0, width), Math.max(0, height)];
}

function resolvedRootSize(record) {
  let [width, height] = record.size;
  if (!width && !height) return DESIGN.slice();
  const preferred = preferredNodeSize(record.visual);
  if (!width) width = preferred[0] || Math.max(300, Math.min(750, height * 3.5));
  if (!height) height = preferred[1] || Math.max(100, Math.min(500, width * .5));
  return [Math.max(1, Math.abs(width)), Math.max(1, Math.abs(height))];
}

function rectInParent(rect, parentSize) {
  const [parentWidth, parentHeight] = parentSize;
  const width = Math.max(0, (rect.anchorMax[0] - rect.anchorMin[0]) * parentWidth + rect.size[0]);
  const height = Math.max(0, (rect.anchorMax[1] - rect.anchorMin[1]) * parentHeight + rect.size[1]);
  const anchorX = (rect.anchorMin[0] + (rect.anchorMax[0] - rect.anchorMin[0]) * rect.pivot[0]) * parentWidth;
  const anchorY = (rect.anchorMin[1] + (rect.anchorMax[1] - rect.anchorMin[1]) * rect.pivot[1]) * parentHeight;
  const pivotX = anchorX + rect.pos[0];
  const pivotY = anchorY + rect.pos[1];
  return {
    left: pivotX - rect.pivot[0] * width,
    top: parentHeight - (pivotY + (1 - rect.pivot[1]) * height),
    width,
    height
  };
}

function addPatch(layer, sprite, source, destination, filter) {
  if (source.width <= 0 || source.height <= 0 || destination.width <= 0 || destination.height <= 0) return;
  const patch = document.createElement('span');
  patch.className = 'patch';
  patch.style.left = `${destination.left}px`;
  patch.style.top = `${destination.top}px`;
  patch.style.width = `${destination.width}px`;
  patch.style.height = `${destination.height}px`;
  const image = document.createElement('img');
  const scaleX = destination.width / source.width;
  const scaleY = destination.height / source.height;
  image.src = sprite.path;
  image.alt = '';
  image.draggable = false;
  image.style.width = `${sprite.textureSize[0] * scaleX}px`;
  image.style.height = `${sprite.textureSize[1] * scaleY}px`;
  image.style.left = `${-source.x * scaleX}px`;
  image.style.top = `${-(sprite.textureSize[1] - source.y - source.height) * scaleY}px`;
  if (filter) image.style.filter = filter;
  patch.appendChild(image);
  layer.appendChild(patch);
}

function drawSimple(layer, sprite, image, size, filter) {
  const [x, y, width, height] = sprite.rect;
  let destination = { left: 0, top: 0, width: size[0], height: size[1] };
  if (image.preserveAspect && width && height) {
    const scale = Math.min(size[0] / width, size[1] / height);
    destination = {
      left: (size[0] - width * scale) / 2,
      top: (size[1] - height * scale) / 2,
      width: width * scale,
      height: height * scale
    };
  }
  addPatch(layer, sprite, { x, y, width, height }, destination, filter);
}

function drawSliced(layer, sprite, image, size, filter) {
  const [x, y, width, height] = sprite.rect;
  const [left, bottom, right, top] = sprite.border;
  if (!(left || bottom || right || top)) return drawSimple(layer, sprite, image, size, filter);
  const unitScale = (sprite.pixelsPerUnit || 100) / 100 * (image.ppuMultiplier || 1);
  let targetLeft = left / unitScale;
  let targetRight = right / unitScale;
  let targetBottom = bottom / unitScale;
  let targetTop = top / unitScale;
  if (targetLeft + targetRight > size[0]) {
    const scale = size[0] / (targetLeft + targetRight);
    targetLeft *= scale;
    targetRight *= scale;
  }
  if (targetTop + targetBottom > size[1]) {
    const scale = size[1] / (targetTop + targetBottom);
    targetTop *= scale;
    targetBottom *= scale;
  }
  // Unity keeps a degenerate center quad when opposing borders consume the
  // whole sprite. Sample two pixels around that seam to match bilinear filtering.
  const centerSourceWidth = Math.max(2, width - left - right);
  const centerSourceHeight = Math.max(2, height - top - bottom);
  const sourceColumns = [
    { x, width: left },
    { x: x + left - (centerSourceWidth - (width - left - right)) / 2, width: centerSourceWidth },
    { x: x + width - right, width: right }
  ];
  const sourceRows = [
    { y: y + height - top, height: top },
    { y: y + bottom - (centerSourceHeight - (height - top - bottom)) / 2, height: centerSourceHeight },
    { y, height: bottom }
  ];
  const destinationColumns = [
    { left: 0, width: targetLeft },
    { left: targetLeft, width: Math.max(0, size[0] - targetLeft - targetRight) },
    { left: size[0] - targetRight, width: targetRight }
  ];
  const destinationRows = [
    { top: 0, height: targetTop },
    { top: targetTop, height: Math.max(0, size[1] - targetTop - targetBottom) },
    { top: size[1] - targetBottom, height: targetBottom }
  ];
  for (let row = 0; row < 3; row++) {
    for (let column = 0; column < 3; column++) {
      if (!image.fillCenter && row === 1 && column === 1) continue;
      addPatch(layer, sprite,
        { x: sourceColumns[column].x, y: sourceRows[row].y, width: sourceColumns[column].width, height: sourceRows[row].height },
        { left: destinationColumns[column].left, top: destinationRows[row].top, width: destinationColumns[column].width, height: destinationRows[row].height },
        filter);
    }
  }
}

function drawBorderImage(layer, sprite, image, size, filter) {
  const [left, bottom, right, top] = sprite.border;
  const sourceWidth = sprite.rect[2];
  const sourceHeight = sprite.rect[3];
  const seamX = left + right >= sourceWidth ? 1 : 0;
  const seamY = top + bottom >= sourceHeight ? 1 : 0;
  const sliceLeft = Math.max(0, left - seamX);
  const sliceRight = Math.max(0, right - seamX);
  const sliceBottom = Math.max(0, bottom - seamY);
  const sliceTop = Math.max(0, top - seamY);
  const unitScale = (sprite.pixelsPerUnit || 100) / 100 * (image.ppuMultiplier || 1);
  let targetLeft = left / unitScale;
  let targetRight = right / unitScale;
  let targetBottom = bottom / unitScale;
  let targetTop = top / unitScale;
  if (targetLeft + targetRight > size[0]) {
    const scale = size[0] / (targetLeft + targetRight);
    targetLeft *= scale;
    targetRight *= scale;
  }
  if (targetTop + targetBottom > size[1]) {
    const scale = size[1] / (targetTop + targetBottom);
    targetTop *= scale;
    targetBottom *= scale;
  }
  layer.style.borderStyle = 'solid';
  layer.style.borderWidth = `${targetTop}px ${targetRight}px ${targetBottom}px ${targetLeft}px`;
  const sourceUrl = `url("${encodeURI(sprite.path)}")`;
  layer.style.borderImageSource = sourceUrl;
  layer.style.borderImageSlice = `${sliceTop} ${sliceRight} ${sliceBottom} ${sliceLeft}${image.fillCenter ? ' fill' : ''}`;
  layer.style.borderImageRepeat = 'stretch';
  if (filter) layer.style.filter = filter;
}

function applyFill(layer, image) {
  const amount = Math.max(0, Math.min(1, image.fillAmount));
  if (image.type !== 3 || amount >= 1) return;
  if (image.fillMethod === 0) {
    layer.style.clipPath = image.fillOrigin === 1
      ? `inset(0 0 0 ${(1 - amount) * 100}%)`
      : `inset(0 ${(1 - amount) * 100}% 0 0)`;
  } else if (image.fillMethod === 1) {
    layer.style.clipPath = image.fillOrigin === 1
      ? `inset(0 0 ${(1 - amount) * 100}% 0)`
      : `inset(${(1 - amount) * 100}% 0 0 0)`;
  }
}

function renderImage(parent, image, size) {
  const layer = document.createElement('span');
  layer.className = 'unity-image';
  layer.style.opacity = image.color ? image.color[3] : 1;
  const filter = image.color ? tintFilter([image.color[0], image.color[1], image.color[2], 1]) : '';
  if (!image.sprite) {
    const solid = image.color ? [image.color[0], image.color[1], image.color[2], 1] : [1, 1, 1, 1];
    layer.style.background = rgba(solid);
  } else if (image.type === 1) {
    const rect = image.sprite.rect;
    const texture = image.sprite.textureSize;
    const usesWholeTexture = rect[0] === 0 && rect[1] === 0 && rect[2] === texture[0] && rect[3] === texture[1];
    if (usesWholeTexture) drawBorderImage(layer, image.sprite, image, size, filter);
    else drawSliced(layer, image.sprite, image, size, filter);
  } else {
    drawSimple(layer, image.sprite, image, size, filter);
  }
  applyFill(layer, image);
  parent.appendChild(layer);
}

function alignmentStyles(alignment) {
  const legacy = alignment >= 0 && alignment <= 8 ? alignment : 4;
  return {
    justifyContent: ['flex-start', 'center', 'flex-end'][legacy % 3],
    alignItems: ['flex-start', 'center', 'flex-end'][Math.floor(legacy / 3)]
  };
}

function renderText(parent, text) {
  const layer = document.createElement('span');
  layer.className = `unity-text${text.bestFit ? ' best-fit' : ''}`;
  layer.textContent = text.value || '';
  const alignment = alignmentStyles(text.alignment);
  layer.style.justifyContent = alignment.justifyContent;
  layer.style.alignItems = alignment.alignItems;
  layer.style.color = rgba(text.color || [1, 1, 1, 1]);
  layer.style.fontFamily = ensureFont(text.font);
  layer.style.fontSize = `${text.bestFit ? text.maxSize : text.fontSize}px`;
  layer.style.fontWeight = text.bold ? '700' : '400';
  layer.style.fontStyle = text.italic ? 'italic' : 'normal';
  if (text.bestFit) {
    layer.dataset.minSize = text.minSize;
    layer.dataset.maxSize = text.maxSize;
  }
  if (text.effect && text.effect.color) {
    const [dx, dy] = text.effect.distance;
    layer.style.textShadow = `${dx}px ${-dy}px 0 ${rgba(text.effect.color)}`;
  }
  parent.appendChild(layer);
}

function layoutChildBoxes(node, parentSize) {
  if (!node.layout) return [];
  const result = new Array(node.children.length);
  const indexed = node.children.map((child, index) => ({ child, index }))
    .filter(item => item.child.active && !item.child.layoutElement?.ignore);
  const items = node.layout.reverse ? indexed.reverse() : indexed;
  if (!items.length) return result;
  const [left, right, top, bottom] = node.layout.padding;
  const innerWidth = Math.max(0, parentSize[0] - left - right);
  const innerHeight = Math.max(0, parentSize[1] - top - bottom);
  const preferred = items.map(item => preferredNodeSize(item.child));
  const spacing = Math.max(0, items.length - 1) * node.layout.spacing;
  let widths = preferred.map((size, index) => node.layout.controlWidth
    ? Math.max(size[0], items[index].child.layoutElement?.minWidth || 0)
    : Math.max(0, items[index].child.rect.size[0]));
  const remaining = Math.max(0, innerWidth - widths.reduce((sum, width) => sum + width, 0) - spacing);
  if (node.layout.expandWidth) widths = widths.map(width => width + remaining / items.length);
  const totalWidth = widths.reduce((sum, width) => sum + width, 0) + spacing;
  const horizontalAlignment = node.layout.alignment % 3;
  let cursor = left + (horizontalAlignment === 1 ? (innerWidth - totalWidth) / 2 : horizontalAlignment === 2 ? innerWidth - totalWidth : 0);
  const verticalAlignment = Math.floor(node.layout.alignment / 3);
  items.forEach((item, index) => {
    let height = node.layout.controlHeight
      ? (node.layout.expandHeight ? innerHeight : Math.min(innerHeight, preferred[index][1]))
      : Math.max(0, item.child.rect.size[1]);
    const y = top + (verticalAlignment === 1 ? (innerHeight - height) / 2 : verticalAlignment === 2 ? innerHeight - height : 0);
    result[item.index] = { left: cursor, top: y, width: widths[index], height };
    cursor += widths[index] + node.layout.spacing;
  });
  return result;
}

function renderNode(node, parent, parentSize, isRoot = false, forcedBox = null) {
  if (!node || !node.active) return;
  const box = forcedBox || (isRoot
    ? { left: 0, top: 0, width: parentSize[0], height: parentSize[1] }
    : rectInParent(node.rect, parentSize));
  const element = document.createElement('span');
  element.className = 'unity-node';
  element.title = node.name;
  element.style.left = `${box.left}px`;
  element.style.top = `${box.top}px`;
  element.style.width = `${box.width}px`;
  element.style.height = `${box.height}px`;
  if (!isRoot && (node.rect.rotation || node.rect.scale[0] !== 1 || node.rect.scale[1] !== 1)) {
    element.style.transformOrigin = `${node.rect.pivot[0] * 100}% ${(1 - node.rect.pivot[1]) * 100}%`;
    element.style.transform = `rotate(${-node.rect.rotation}deg) scale(${node.rect.scale[0]},${node.rect.scale[1]})`;
  }
  parent.appendChild(element);
  if (node.image) renderImage(element, node.image, [box.width, box.height]);
  if (node.text) renderText(element, node.text);
  const layoutBoxes = layoutChildBoxes(node, [box.width, box.height]);
  node.children.forEach((child, index) => renderNode(
    child, element, [box.width, box.height], false, layoutBoxes[index]));
}

function fitCanvas(canvas, host, allowUpscale = true) {
  const width = Number(canvas.dataset.width);
  const height = Number(canvas.dataset.height);
  const scale = Math.min((host.clientWidth - 28) / width, (host.clientHeight - 28) / height, allowUpscale ? 3 : 1);
  canvas.style.transform = `translate(-50%, -50%) scale(${Math.max(.01, scale)})`;
}

function renderTemplate(name, host, allowUpscale = true) {
  const record = KIT[name];
  if (!record || !record.visual) return;
  host.replaceChildren();
  const size = resolvedRootSize(record);
  const canvas = document.createElement('span');
  canvas.className = 'prefab-canvas';
  canvas.dataset.width = size[0];
  canvas.dataset.height = size[1];
  canvas.style.width = `${size[0]}px`;
  canvas.style.height = `${size[1]}px`;
  host.appendChild(canvas);
  renderNode(record.visual, canvas, size, true);
  fitCanvas(canvas, host, allowUpscale);
  return canvas;
}

function fitText(element) {
  if (!element.clientWidth || !element.clientHeight) return;
  let low = Number(element.dataset.minSize || 3);
  let high = Number(element.dataset.maxSize || 40);
  while (high - low > .5) {
    const middle = (low + high) / 2;
    element.style.fontSize = `${middle}px`;
    if (element.scrollWidth <= element.clientWidth && element.scrollHeight <= element.clientHeight) low = middle;
    else high = middle;
  }
  element.style.fontSize = `${low}px`;
}

function fitAllText() { document.querySelectorAll('.best-fit').forEach(fitText); }

cards.forEach(card => {
  const host = card.querySelector('.prefab-host');
  renderTemplate(card.dataset.template, host);
  card.querySelector('.preview').onclick = () => openModal(card.dataset.template);
});
requestAnimationFrame(fitAllText);

const resizeObserver = new ResizeObserver(entries => entries.forEach(entry => {
  const canvas = entry.target.querySelector('.prefab-canvas');
  if (canvas) fitCanvas(canvas, entry.target, !entry.target.classList.contains('modalhost'));
}));
document.querySelectorAll('.prefab-host').forEach(host => resizeObserver.observe(host));

search.addEventListener('input', () => {
  const query = search.value.trim().toLowerCase();
  let shown = 0;
  cards.forEach(card => {
    const visible = !query || card.dataset.name.includes(query);
    card.hidden = !visible;
    if (visible) shown++;
  });
  visibleCount.textContent = shown;
  empty.style.display = shown ? 'none' : 'block';
});

document.querySelectorAll('[data-background]').forEach(button => button.onclick = () => {
  document.querySelectorAll('[data-background]').forEach(item => item.classList.toggle('active', item === button));
  const mode = button.dataset.background;
  document.querySelectorAll('.preview').forEach(preview => {
    preview.style.background = mode === 'light' ? '#eef1f4' : mode === 'dark' ? '#0b0d12' : '#0b0d12';
    preview.querySelector('.checker').style.display = mode === 'checker' ? 'block' : 'none';
  });
});

const modal = document.getElementById('modal');
const modalHost = document.getElementById('modalHost');
function openModal(name) {
  const size = resolvedRootSize(KIT[name]);
  document.getElementById('modalName').textContent = name;
  document.getElementById('modalSize').textContent = `${size[0]} × ${size[1]}`;
  modal.classList.add('open');
  renderTemplate(name, modalHost, false);
  resizeObserver.observe(modalHost);
  modal.querySelector('.close').focus();
  requestAnimationFrame(fitAllText);
}
function closeModal() {
  modal.classList.remove('open');
  resizeObserver.unobserve(modalHost);
  modalHost.replaceChildren();
}
modal.querySelector('.close').onclick = closeModal;
modal.onclick = event => { if (event.target === modal) closeModal(); };
document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
const params = new URLSearchParams(location.search);
if (params.has('template')) {
  search.value = params.get('template');
  search.dispatchEvent(new Event('input'));
}
if (params.has('inspect') && KIT[params.get('inspect')]) {
  requestAnimationFrame(() => openModal(params.get('inspect')));
}
</script>
</body>
</html>
