schema_version: "1.0"
name: 10-animation-nhan-vat
description: "Câu animation nhân vật: skill ui-motion không được bật."
tags: [negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Làm clip đòn chém cho nhân vật Knight thì startup nên bao nhiêu frame?
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
runs: 1
graders:
  - type: tool_used
    name: khong_bat_nham
    tool: Skill
    input_match: ui-motion
    max: 0
    arm: with-only
  - type: llm
    name: huong_dung
    criteria: >-
      Câu trả lời xử lý như animation nhân vật trong game (frame data, clip), không dùng component UI Motion hay tween UI cho việc này.
