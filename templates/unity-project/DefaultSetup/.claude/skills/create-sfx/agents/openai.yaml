interface:
  display_name: "Create SFX"
  short_description: "Game sound effects from Freesound via the ezg-sfx MCP (fallback: synthesized in code), mastered and wired into Unity"
  default_prompt: "Use $create-sfx to create a sound effect (UI click / popup / reward / level up, or a gameplay fire / shot / hit sound): find it on Freesound through the ezg-sfx MCP first (synthesize it in code only when that MCP is not available), then wire it into SoundConfig or a prefab's SoundPlayController."
