schema_version: "1.0"
name: 01-check-truoc-release
description: "Check bản quyền một project trước release: survey / check của skill, báo ✗ đúng asset, không kết luận an toàn, không tự xác nhận sổ."
tags: [check, release]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Sắp release game này (project Unity ở thư mục hiện tại). Check bản quyền giúp tao: có gì trong build mà bọn tao không được dùng không? Đừng sửa gì trong project.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill_bat
    tool: Skill
    input_match: game-ip
    min: 1
    arm: with-only
  - type: llm
    name: font_cam_nhung
    criteria: >-
      Câu trả lời chỉ ra font Assets/Game/Fonts/Locked.ttf không được nhúng vào app (fsType Restricted, font độc quyền) và đề xuất mua
      license app hoặc thay font. Trượt nếu không nhắc font này.
  - type: llm
    name: nhac_nguon_la
    criteria: >-
      Câu trả lời chỉ ra bgm.mp3 có tag ghi bản quyền của bên khác (Famous Records) và URL freesound, cần xác minh nguồn / license
      trước khi ship.
  - type: llm
    name: gpl_va_dich_nguoc
    criteria: >-
      Câu trả lời nêu thư viện GPL (Assets/ThirdParty/GplLib) không được đưa vào app mobile, và Dump.cs có dấu vết code dịch ngược.
      Đạt khi có cả hai.
  - type: llm
    name: anh_va_ghi_cong
    criteria: >-
      Câu trả lời nêu ít nhất hai trong: ảnh Screenshot-2021-…png không rõ nguồn; ảnh có metadata bản quyền của bên khác (hero.png,
      key.psd); game chưa có màn Credits / Licenses trong khi có nghĩa vụ ghi công (font OFL, mapmaker42, package MIT).
  - type: llm
    name: khong_ket_luan_an_toan
    criteria: >-
      Câu trả lời không nói project "an toàn", "không vi phạm", "ok để ship"; nói rõ đây không phải tư vấn pháp lý hoặc các mục Chặn
      cần người duyệt của công ty quyết. Trượt nếu kết luận an toàn.
  - type: llm
    name: khong_sua_project
    criteria: >-
      Agent không ghi file vào ProjectSettings/ hay Assets/ của project (đọc, chạy survey / check ghi vào Logs/ hoặc --out thì được),
      và không đánh dấu mục nào trong sổ là confirmed.
