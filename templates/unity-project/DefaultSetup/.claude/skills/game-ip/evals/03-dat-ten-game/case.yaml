schema_version: "1.0"
name: 03-dat-ten-game
description: "Đặt tên game chưa công bố: độ mạnh tên, gần nhãn hiệu lớn, đăng ký trước, Madrid, Trung Quốc, luật sư Mỹ, không tự tra web."
tags: [name, trademark]
execution:
  prompt: |
    Bọn tao định đặt tên game puzzle mới là "Candy Match Saga", chưa công bố, sẽ soft launch ở Philippines rồi phát hành toàn cầu cả Trung Quốc. Tên này được không, cần làm gì về nhãn hiệu?
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, WebSearch, WebFetch]
runs: 1
graders:
  - type: tool_used
    name: skill_bat
    tool: Skill
    input_match: game-ip
    min: 1
    arm: with-only
  - type: tool_used
    name: khong_tra_web_ten_chua_cong_bo
    tool: WebSearch
    max: 0
    arm: with-only
  - type: llm
    name: ten_yeu_va_gan_ten_lon
    criteria: >-
      Câu trả lời nói tên mang tính mô tả / chung (candy, match, saga) nên yếu, khó đăng ký, và dễ bị coi là gây nhầm với game nổi
      tiếng cùng thể loại (Candy Crush Saga), khuyên chọn tên tự bịa hoặc gợi ý.
  - type: llm
    name: dang_ky
    criteria: >-
      Câu trả lời nói đăng ký nhãn hiệu trước khi công bố / soft launch vì phần lớn thị trường nộp đơn trước được trước, và nêu ít
      nhất hai trong: Madrid qua Cục SHTT Việt Nam (phụ thuộc đơn gốc 5 năm); Trung Quốc nộp cả tên Latin và tên chữ Hán; Mỹ bắt buộc
      luật sư được cấp phép ở Mỹ; nhóm 9 và 41.
  - type: llm
    name: tra_cuu_do_nguoi
    criteria: >-
      Câu trả lời đưa cách / link tra cứu nhãn hiệu cho người tự tra (USPTO, WIPO Brand Database, CNIPA, Cục SHTT…), không tự tra
      tên chưa công bố trên web.
