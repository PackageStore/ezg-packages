schema_version: "1.0"
name: 06-khong-bat-ui-tween
description: "Câu UI tween. Skill game-vfx không được bật: tween, rung, nảy của nút là việc của UI Motion."
tags: [negative, ui]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Làm cho nút Play ở màn hình chính nảy lên một chút khi bấm giúp mình.
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: khong_bat_nham
    tool: Skill
    input_match: game-vfx
    max: 0
    arm: with-only
  - type: llm
    name: huong_ui
    criteria: >-
      Câu trả lời xử lý bằng tween hoặc motion của UI (ví dụ scale nảy bằng tween, hệ UI Motion của project nếu có),
      không đề xuất làm ParticleSystem hay hiệu ứng hạt cho nút.
