schema_version: "1.0"
name: 07-khong-bat-anim
description: "Câu animation nhân vật. Skill game-vfx không được bật: clip là việc của Game Animation."
tags: [negative, animation]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Làm clip idle thở cho nhân vật chính 3D: dài bao lâu, loop thế nào?
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 1
graders:
  - type: tool_used
    name: khong_bat_nham
    tool: Skill
    input_match: game-vfx
    max: 0
    arm: with-only
  - type: llm
    name: huong_anim
    criteria: >-
      Câu trả lời nói về AnimationClip (độ dài, key đầu và cuối giống nhau để loop, Loop Time), không nói về
      ParticleSystem hay VFX.
